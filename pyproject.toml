[project]
name = "trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QianZF", email = "2637403975@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=4.0.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.57",
]

[project.scripts]
trip-planner = "trip_planner:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
