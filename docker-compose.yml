services:
  postgres:
    image: postgres:16
    container_name: trip_postgres
    environment:
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: trip_dev
      POSTGRES_DB: trip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trip_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: